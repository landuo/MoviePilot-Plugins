services:
  promotion-guard:
    image: ${MOVIEPILOT_IMAGE:?Set the installed MoviePilot image ID or digest}
    container_name: brushflow-promotion-guard
    entrypoint: ["python", "-u", "/guard/promotion_guard.py"]
    command: ["--task-id", "${BRUSHFLOW_GUARD_TASK_ID:?Set the exact task ID}"]
    restart: unless-stopped
    user: "${MOVIEPILOT_CONFIG_UID:-1000}:${MOVIEPILOT_CONFIG_GID:-1000}"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${MOVIEPILOT_CONFIG_DIR:?Set the MoviePilot config directory}:/config:ro
      - ./promotion_guard.py:/guard/promotion_guard.py:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "python", "/guard/promotion_guard.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
